name: Publish presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PLAYWRIGHT_BUNDLED_BROWSER: '1'

jobs:
  build:
    name: Build and test all eight scenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the compiled application
        run: npm run test:e2e
        env:
          E2E_BUILD: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pre-publication-browser-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Publish HTTPS site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    name: Verify the live presentation on desktop and touch
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the published HTML
        env:
          PRESENTATION_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "$PRESENTATION_URL" -o /tmp/presentation.html && grep -q 'Сила инфографики' /tmp/presentation.html; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Test all scenes on the public HTTPS site
        run: npm run test:e2e
        env:
          PRESENTATION_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-site-browser-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 7
